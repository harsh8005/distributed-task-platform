version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dtp
      POSTGRES_USER: dtp
      POSTGRES_PASSWORD: dtp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtp -d dtp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg2://dtp:dtp@postgres:5432/dtp
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      ENABLE_REDIS: "true"
      ENABLE_RABBITMQ: "true"
      ENABLE_OTEL: "true"
      OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      AUTO_CREATE_TABLES: "true"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - jaeger

  worker:
    build: .
    command: python worker.py
    environment:
      DATABASE_URL: postgresql+psycopg2://dtp:dtp@postgres:5432/dtp
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      ENABLE_REDIS: "true"
      ENABLE_RABBITMQ: "true"
      ENABLE_OTEL: "true"
      OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      AUTO_CREATE_TABLES: "true"
    depends_on:
      - api
      - postgres
      - rabbitmq
      - jaeger

  scheduler:
    build: .
    command: python scheduler.py
    environment:
      DATABASE_URL: postgresql+psycopg2://dtp:dtp@postgres:5432/dtp
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      ENABLE_REDIS: "true"
      ENABLE_RABBITMQ: "true"
      ENABLE_OTEL: "true"
      OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      AUTO_CREATE_TABLES: "true"
    depends_on:
      - api
      - postgres
      - rabbitmq
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus


